<style>

button{font-family:inherit;cursor:pointer}

.fc small{color:var(--mut);font-size:12px;margin-bottom:14px}
.fc.back{background:linear-gradient(160deg,var(--p3),var(--card))}

.btn{flex:1;min-height:50px;border:2px solid var(--p1);background:var(--card);color:var(--p1);border-radius:16px;padding:10px;font-weight:700;font-size:15px}

.q>b{display:block;font-size:17px;line-height:1.4;margin-bottom:4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;min-height:50px;text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 13px;margin-top:8px;font-size:15px}
.lt{flex:none;width:26px;height:26px;border-radius:50%;background:var(--p3);color:var(--p1);display:grid;place-items:center;font-size:13px}
.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}

.opt.no .lt{background:var(--no);color:var(--nob)}
.ex{margin-top:12px;padding:12px 14px;background:var(--p3);border-radius:14px;font-size:14px}
.sm{color:var(--mut);font-size:13px}
.ring{width:150px;height:150px;margin:6px auto 14px;border-radius:50%;background:conic-gradient(var(--p1) calc(var(--v)*1%),var(--p3) 0);display:grid;place-items:center}
.ring b{width:116px;height:116px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:700 34px Georgia,serif;color:var(--p1)}
.tw{overflow-x:auto;margin-bottom:14px;border:1px solid var(--bd);border-radius:16px;background:var(--card);box-shadow:var(--sh)}
table{border-collapse:collapse;min-width:560px;width:100%;font-size:14px}
th,td{padding:10px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--bd)}
th{background:var(--p3);color:var(--p1)}
td:first-child{position:sticky;left:0;background:var(--card)}
th:first-child{position:sticky;left:0}
h2{font:700 21px Georgia,serif;color:var(--p1);margin:20px 0 10px}
:focus-visible{outline:3px solid var(--p1);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

["A via alternativa é ativada por:",["Depósito espontâneo de C3b no patógeno","LLM ligada à manose","C1 ligado a anticorpos","C5a"],0,"Lectina usa LLM; clássica usa C1 + anticorpos."],
["A via da lectina é ativada quando:",["A LLM se liga à manose do patógeno","C1 se liga a IgG","C3b se deposita","A IL-2 se liga ao receptor"],0,"Via da lectina = LLM + manose."],
["Qual função do complemento é exercida pelo C3b?",["Opsonização","Lise osmótica","Quimiotaxia de neutrófilos","Degranulação de mastócitos"],0,"C3b se deposita no micróbio e facilita a fagocitose."],
["Quais são os mecanismos de morte bacteriana citados no material?",["Fagocitose e lise osmótica","Apenas perforinas","IgE e eosinófilos","Anergia e memória"],0,"Lise osmótica = MAC."],
["As anafilatoxinas estimulam:",["Degranulação de mastócitos e quimiotaxia de neutrófilos","Troca de classe para IgE","Formação de clones de T","Apresentação de antígenos"],0,"C3a, C4a e C5a."],
["Qual o papel das APCs na ponte inata-adaptativa?",["Fagocitam via RRPs, processam e apresentam via MHC II com co-estimulação","Produzem IgE","Lisam células com perforinas","Formam o MAC"],0,"Também fornecem citocinas."],
["Quais citocinas das APCs são necessárias para ativar o linfócito T?",["IL-1, IL-6 e IL-12","IL-4, IL-5 e IL-13","IL-17 e IL-22","IFN-γ e perforina"],0,"Junto com B7/CD28."],
["Quantos sinais o linfócito T virgem precisa para ser ativado?",["Três","Dois","Quatro","Um"],0,"Antígeno, co-estimulação e citocinas."],
["No sinal 2, o CD28 do linfócito T liga-se a:",["B7 da APC","MHC II","IL-2","TCR"],0,"É o sinal de sobrevivência."],
["O sinal 2 garante que a resposta ocorra somente se:",["A APC tiver sido ativada por um perigo real","Houver febre","Houver IgE circulante","A célula for tumoral"],0,"Sem ele, ocorre anergia."],
["Após os três sinais, o linfócito T sintetiza:",["IL-2 e a cadeia de alta afinidade do seu receptor","IgE","C3 convertase","Lisozima"],0,"A IL-2 atua de forma autócrina."],
["Qual perfil ativa macrófagos contra Mycobacterium?",["Th1","Th2","Th17","Basófilo"],0,"Intracelulares: Th1."],
["Quais moléculas o Th1 estimula nos macrófagos para destruir microrganismos?",["Óxido nítrico (NO) e ROS","Perforinas e granzimas","IgE e histamina","IL-17 e IL-22"],0,"Ativação clássica do macrófago."],
["Qual citocina do Th2 aumenta o muco e o peristaltismo intestinal?",["IL-13","IL-5","IL-22","IL-12"],0,"IL-5 recruta e ativa eosinófilos."],
["Qual perfil estimula o linfócito B a trocar para IgE?",["Th2","Th1","Th17","CTL"],0,"A IgE se liga a mastócitos e basófilos."],
["O Th17 induz células epiteliais, estromais e macrófagos a produzirem quimiocinas para recrutar:",["Neutrófilos","Eosinófilos","Basófilos","Células NK"],0,"Via IL-17 e IL-22."],
["Quais são os alvos principais dos CTLs?",["Células infectadas (vírus, bactérias/parasitas citoplasmáticos) e tumorais","Helmintos extracelulares","Bactérias extracelulares","Alérgenos"],0,"Células do próprio organismo anormais ou perigosas."],
["Os CTLs reconhecem antígenos apresentados por:",["MHC classe I em qualquer célula nucleada","MHC II só em APCs","B7","Anticorpos"],0,"Peptídeos endógenos via MHC I."]
];
const TH=[["Perfil","Induzido por","Citocinas / mediadores","Alvo","Função"],
["Th1","IL-12 / IFN-γ","IFN-γ, IL-2","Intracelulares","Ativa macrófagos (NO, ROS); ajuda CD8+"],
["Th2","IL-4","IL-4, IL-5, IL-13","Helmintos e alérgenos","IgE, eosinófilos, muco, peristaltismo"],
["Th17","TGF-β + IL-6","IL-17, IL-22","Fungos e bactérias extracelulares","Recruta neutrófilos; protege mucosas"],
["CTL (CD8+)","IL-2, IFN-γ, IL-15 (ajuda do Th1)","Perforinas e granzimas","Células infectadas e tumorais","Apoptose da célula alvo (MHC I)"]];
const CP=[["Via","Gatilho"],["Alternativa","C3b depositado espontaneamente no patógeno"],["Lectina","LLM ligada à manose do patógeno"],["Clássica","C1 ligado a IgM ou IgG no patógeno"],["Comum","C3 convertase → C5 convertase → C5 a C9 (MAC)"]];
const PG=["Sinal 2 ausente = anergia.","CD4+ usa MHC II; CD8+ usa MHC I.","TLRs 1, 2, 4, 5, 6 na superfície; 3, 7, 8, 9 nos endossomos.","Neutrófilo chega primeiro; monócito depois.","PCR liga fosforilcolina; LLM liga manose.","C3a, C4a e C5a são anafilatoxinas; MAC é C5b-C9."];
const ls={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TABS=[["resumo","📖","Resumo"],["cartoes","🃏","Cartões"],["quiz","🎯","Quiz"],["tabelas","📊","Tabelas"]];
const TP=["Todos",...new Set(C.map(c=>c[0]))];
let tab="resumo",known=new Set(ls.g("bel-known",[])),topic="Todos",pend=false,ci=0,flip=false,qs=[],qi=0,sc=0,ans=null,best=ls.g("bel-best2",null),fin=false,miss=[];
const $=s=>document.querySelector(s);
const deck=()=>C.map((c,i)=>({c,i})).filter(x=>(topic=="Todos"||x.c[0]==topic)&&(!pend||!known.has(x.i)));
const tbl=r=>"<div class=\"tw\"><table><tr>"+r[0].map(h=>"<th>"+h+"</th>").join("")+"</tr>"+r.slice(1).map(x=>"<tr>"+x.map((c,j)=>"<td>"+(j?c:"<b>"+c+"</b>")+"</td>").join("")+"</tr>").join("")+"</table></div>";
function go(t){tab=t;render();window.scrollTo(0,0)}
function setTopic(t){topic=t;ci=0;flip=false;render()}
function togPend(){pend=!pend;ci=0;flip=false;render()}
function flipC(){flip=!flip;render()}
function step(d){const n=deck().length;ci=(ci+d+n)%n;flip=false;render()}
function rnd(){ci=Math.floor(Math.random()*deck().length);flip=false;render()}
function mark(k){const x=deck()[ci];k?known.add(x.i):known.delete(x.i);ls.s("bel-known",[...known]);flip=false;if(!(pend&&k))ci++;if(ci>=deck().length)ci=0;render()}
function resetK(){known=new Set();ls.s("bel-known",[]);ci=0;render()}
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQ(n){qs=sh(Q).slice(0,n||Q.length).map(q=>{const o=sh(q[1].map((t,i)=>[t,i==q[2]]));return [q[0],o.map(x=>x[0]),o.findIndex(x=>x[1]),q[3]]});qi=0;sc=0;ans=null;fin=false;miss=[];render()}
function pick(i){if(ans!==null)return;ans=i;if(i==qs[qi][2])sc++;else miss.push(qs[qi]);render()}
function nextQ(){ans=null;qi++;if(qi>=qs.length){fin=true;const p=Math.round(sc/qs.length*100);if(best===null||p>best){best=p;ls.s("bel-best2",best)}}render()}
function vResumo(){return "<p class=\"sm\">Toque em cada tópico para abrir.</p>"+S.map(s=>"<details><summary>"+s[0]+"</summary>"+s[1]+"</details>").join("")}
function vCartoes(){
let h="<div class=\"chips\">"+TP.map(t=>"<button class=\"chip"+(t==topic?" on":"")+"\" onclick=\"setTopic('"+t+"')\">"+t+"</button>").join("")+"</div>";
h+="<div class=\"sm\">Sabidos: "+known.size+" de "+C.length+" · <label><input type=\"checkbox\" "+(pend?"checked":"")+" onchange=\"togPend()\"> só pendentes</label></div><div class=\"bar\"><i style=\"width:"+(known.size/C.length*100)+"%\"></i></div>";
const d=deck();
if(!d.length)return h+"<div class=\"card\" style=\"text-align:center\">Você já sabe todos os cartões desta seleção! 💖<div class=\"row\"><button class=\"btn main\" onclick=\"resetK()\">Recomeçar tudo</button></div></div>";
ci=Math.min(ci,d.length-1);const x=d[ci];
h+="<div class=\"card fc"+(flip?" back":"")+"\" onclick=\"flipC()\" tabindex=\"0\" role=\"button\"><small>"+x.c[0]+" · cartão "+(ci+1)+" de "+d.length+" · toque para virar</small>"+(flip?x.c[2]:"<b>"+x.c[1]+"</b>")+"</div>";
h+="<div class=\"row\"><button class=\"btn\" onclick=\"mark(false)\">Preciso rever</button><button class=\"btn main\" onclick=\"mark(true)\">Já sei 💖</button></div>";
return h+"<div class=\"row\"><button class=\"btn\" onclick=\"step(-1)\">← Anterior</button><button class=\"btn\" onclick=\"rnd()\">🎲</button><button class=\"btn\" onclick=\"step(1)\">Próximo →</button></div>"}
function vQuiz(){
if(!qs.length)return "<div class=\"card\" style=\"text-align:center\"><h2 style=\"margin-top:0\">Quiz de Imunologia</h2><p>"+Q.length+" questões no banco. A cada rodada, as questões e as alternativas vêm em ordem aleatória.</p>"+(best!==null?"<p class=\"sm\">Melhor resultado: "+best+"%</p>":"")+"<div class=\"row\"><button class=\"btn main\" onclick=\"startQ(10)\">10 questões</button><button class=\"btn main\" onclick=\"startQ(20)\">20 questões</button><button class=\"btn main\" onclick=\"startQ(0)\">Todas</button></div></div>";
if(fin){const p=Math.round(sc/qs.length*100);return "<div class=\"card\" style=\"text-align:center\"><div class=\"ring\" style=\"--v:"+p+"\"><b>"+sc+"/"+qs.length+"</b></div><p>"+(p>=80?"Arrasou, Laura! 🌸":p>=50?"Está indo bem! Revise os cartões e tente de novo. 💪":"Bora revisar o resumo e os cartões, você consegue! 💗")+"</p>"+(miss.length?"<div style=\"text-align:left\"><b>Para revisar:</b><ul>"+miss.map(m=>"<li>"+m[0]+"<br><span class=\"sm\">Resposta: "+m[1][m[2]]+"</span></li>").join("")+"</ul></div>":"")+"<div class=\"row\"><button class=\"btn main\" onclick=\"startQ(10)\">Nova rodada (10)</button><button class=\"btn\" onclick=\"qs=[];render()\">Escolher tamanho</button></div></div>"}
const q=qs[qi];
let h="<div class=\"sm\">Questão "+(qi+1)+" de "+qs.length+" · acertos: "+sc+"</div><div class=\"bar\"><i style=\"width:"+(qi/qs.length*100)+"%\"></i></div><div class=\"q\"><b>"+q[0]+"</b>";
h+=q[1].map((o,i)=>"<button class=\"opt"+(ans!==null?(i==q[2]?" ok":i==ans?" no":""):"")+"\" onclick=\"pick("+i+")\"><b class=\"lt\">"+"ABCD"[i]+"</b><span>"+o+"</span></button>").join("");
if(ans!==null)h+="<div class=\"ex\">"+(ans==q[2]?"✅ Certo! ":"❌ Não foi dessa vez. ")+q[3]+"</div><div class=\"row\"><button class=\"btn main\" onclick=\"nextQ()\">"+(qi+1<qs.length?"Próxima":"Ver resultado")+"</button></div>";
return h+"</div>"}
function vTab(){return "<h2>Células T: comparativo</h2>"+tbl(TH)+"<h2>Vias do complemento</h2>"+tbl(CP)+"<h2>Pegadinhas de prova</h2><div class=\"card\"><ul style=\"margin:0;padding-left:20px\">"+PG.map(p=>"<li>"+p+"</li>").join("")+"</ul></div>"}
function render(){
$("#nav").innerHTML=TABS.map(t=>"<button class=\""+(t[0]==tab?"on":"")+"\" onclick=\"go('"+t[0]+"')\"><span>"+t[1]+"</span>"+t[2]+"</button>").join("");
$("#app").innerHTML={resumo:vResumo,cartoes:vCartoes,quiz:vQuiz,tabelas:vTab}[tab]()}
render();
</script>
</body>
</html>
